name: "CI C++: Linux"

on:
  workflow_call:
  push:
    branches:
      - master
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Ubuntu (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
        - {
          name: "Latest Clang",
          cc: "clang",
          cxx: "clang++",
          xmake-toolchain: '--toolchain=llvm --sdk="$GITHUB_WORKSPACE/llvm"'
        }
    steps:
    - uses: actions/checkout@v4
    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: branch@master

    - name: Install Latest Clang
      if: ${{ matrix.compiler.name == 'Latest Clang' }}
      uses: MorganCaron/latest-clang-action@master

    - name: Update xmake repository
      run: xmake repo --update

    - name: Configure & Install dependencies
      run: |
        xmake f ${{ matrix.compiler.xmake-toolchain }} --runtimes="c++_shared" --enable_tests=y -v --yes

    - name: Build
      run: |
        xmake build -v

    - name: Run tests
      run: |
        xmake run Flow-UnitTests

    - name: Run sample pipeline batch
      run: |
        bash scripts/copy_samples.sh
        xmake run Flow
